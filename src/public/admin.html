<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Escuela Limpia</title>
  <!-- Enlace oficial de Chart.js para dibujar las estadísticas -->
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f1f5f9; color: #334155; padding: 20px; }
    .contenedor { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: #1e293b; margin-bottom: 8px; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    p { color: #64748b; margin-bottom: 20px; font-size: 14px; }
    
    /* Sección del Formulario de Contraseña */
    #login-seccion { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    #login-seccion input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; text-align: center; }
    
    /* Elementos del Panel General */
    .grafica-seccion { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 25px; height: 320px; }
    .item-admin { background: #f8fafc; padding: 20px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .item-admin.pendiente { border-left: 6px solid #eab308; }
    .item-admin.resuelto { border-left: 6px solid #22c55e; background: #f0fdf4; }
    .info { font-size: 15px; line-height: 1.6; }
    .meta { font-size: 12px; color: #94a3b8; margin-top: 5px; }
    .badge { display: inline-block; padding: 3px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; margin-left: 5px; }
    .badge.pendiente { background: #fef9c3; color: #854d0e; }
    .badge.resuelto { background: #dcfce7; color: #166534; }
    .foto-reporte { max-width: 200px; max-height: 150px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 5px; display: block; object-fit: cover; }
    .acciones { display: flex; gap: 10px; margin-top: 5px; justify-content: flex-end; }
    
    /* Botones */
    .btn { padding: 8px 16px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn-resolver { background-color: #22c55e; color: white; }
    .btn-borrar { background-color: #ef4444; color: white; }
    .btn-login { background-color: #1e293b; color: white; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; }
    .live-indicator { float: right; font-size: 12px; background: #e2e8f0; padding: 4px 8px; border-radius: 20px; color: #475569; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Vista Inicial: Login de Contraseña -->
  <div id="login-seccion">
    <h2 style="color: #1e293b;">🔑 Panel de Control</h2>
    <p style="margin-top: 5px;">Introduce la clave administrativa de la escuela</p>
    <input type="password" id="passAdmin" placeholder="Contraseña de acceso">
    <button class="btn btn-login" onclick="validarAcceso()">Ingresar al Sistema</button>
  </div>

  <!-- Vista Secundaria: Dashboard (Oculto al inicio) -->
  <div class="contenedor" id="panel-principal" style="display: none;">
    <span class="live-indicator">● Sincronizado con Firebase</span>
    <h1>🌿 Panel de Administración (Base de Datos)</h1>
    <p>Métricas dinámicas y gestión automática de reportes de la base de datos.</p>

    <div class="grafica-seccion">
      <canvas id="graficaReportes"></canvas>
    </div>

    <h2>📋 Listado General de Reportes</h2>
    <br>
    <div id="lista-admin">Cargando reportes del sistema...</div>
    <br>
    <button class="btn btn-borrar" onclick="location.reload()" style="max-width: 150px;">Salir del Panel</button>
  </div>
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://gstatic.com";

    // ⚠️ COPIA AQUÍ TUS CREDENCIALES REALES DE FIREBASE
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CONTRASEÑA_CORRECTA = "admin123"; 
    const listaAdmin = document.getElementById("lista-admin");
    let miGrafica = null; 

    // Función que verifica la contraseña y cambia de pestaña
    function validarAcceso() {
      const intento = document.getElementById("passAdmin").value;
      if (intento === CONTRASEÑA_CORRECTA) {
        document.getElementById("login-seccion").style.display = "none"; 
        document.getElementById("panel-principal").style.display = "block"; 
        
        consultarReportes(); 
        // Actualización automática en segundo plano cada 4 segundos
        setInterval(consultarReportes, 4000);
      } else {
        alert("Contraseña incorrecta. Acceso denegado.");
        document.getElementById("passAdmin").value = "";
      }
    }
    async function consultarReportes() {
      try {
        const q = query(collection(db, "reportes"), orderBy("fechaRaw", "desc"));
        const querySnapshot = await getDocs(q);
        
        listaAdmin.innerHTML = "";
        
        if (querySnapshot.empty) {
          listaAdmin.innerHTML = "<p>No hay reportes registrados en la red escolar.</p>";
          inicializarGrafica([]); 
          return;
        }

        const datosParaGrafica = [];

        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const idDoc = docSnap.id;

          // Guardamos las fechas limpias para la gráfica lineal
          datosParaGrafica.push({
            fecha: item.fechaRaw,
            estado: item.estado
          });

          const div = document.createElement("div");
          const esResuelto = item.estado === "Resuelto";
          div.className = `item-admin ${esResuelto ? 'resuelto' : 'pendiente'}`;
          
          const htmlFoto = item.fotoUrl ? `<img src="${item.fotoUrl}" class="foto-reporte" alt="Evidencia">` : "";
          
          const botonResolver = !esResuelto 
            ? `<button class="btn btn-resolver" onclick="marcarResuelto('${idDoc}')">Marcar Resuelto ✅</button>` 
            : `<span class="badge resuelto">Completado</span>`;

          div.innerHTML = `
            <div class="info">
              <strong>👤 Alumno:</strong> ${item.usuario || "Anónimo"} 
              <span class="badge ${esResuelto ? 'resuelto' : 'pendiente'}">${item.estado || 'Pendiente'}</span>
              <br>
              <strong>📝 Reporte:</strong> ${item.descripcion}
              ${htmlFoto}
              <div class="meta">ID: ${idDoc} | Fecha: ${item.fechaHora || "Sin fecha"}</div>
            </div>
            <div class="acciones">
              ${botonResolver}
              <button class="btn btn-borrar" onclick="eliminarReporte('${idDoc}')">Eliminar 🗑️</button>
            </div>
          `;
          listaAdmin.appendChild(div);
        });

        inicializarGrafica(datosParaGrafica);
      } catch (error) {
        console.error("Error cargando actualizaciones de Firebase:", error);
        listaAdmin.innerHTML = "<p style='color:red; font-weight:bold;'>Error: Verifica que pusiste tus credenciales de Firebase.</p>";
      }
    }
    function inicializarGrafica(datos) {
      try {
        const conteoDias = {};
        
        datos.forEach(item => {
          if (!item.fecha || typeof item.fecha !== 'string') return;
          
          // CORREGIDO: Toma el primer fragmento de la fecha (YYYY-MM-DD)
          const fechaDia = item.fecha.split("T")[0]; 
          
          if (!conteoDias[fechaDia]) {
            conteoDias[fechaDia] = { obtenidos: 0, resueltos: 0 };
          }
          
          conteoDias[fechaDia].obtenidos++;
          if (item.estado === "Resuelto") {
            conteoDias[fechaDia].resueltos++;
          }
        });

        const diasOrdenados = Object.keys(conteoDias).sort();
        const datosObtenidos = diasOrdenados.map(dia => conteoDias[dia].obtenidos);
        const datosResueltos = diasOrdenados.map(dia => conteoDias[dia].resueltos);

        const ctx = document.getElementById('graficaReportes').getContext('2d');
        if (miGrafica) miGrafica.destroy();

        miGrafica = new Chart(ctx, {
          type: 'line', 
          data: {
            labels: diasOrdenados, 
            datasets: [
              { label: 'Obtenidos', data: datosObtenidos, borderColor: '#eab308', backgroundColor: 'rgba(234, 179, 8, 0.1)', tension: 0.3, borderWidth: 3, fill: true },
              { label: 'Resueltos', data: datosResueltos, borderColor: '#22c55e', backgroundColor: 'rgba(34, 197, 94, 0.1)', tension: 0.3, borderWidth: 3, fill: true }
            ]
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            animation: false, 
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } 
          }
        });
      } catch (err) { 
        console.error("Error al renderizar el canvas de Chart.js:", err); 
      }
    }

    // Funciones en la nube para actualizar el estado y eliminar reportes definitivamente
    window.marcarResuelto = async function(id) {
      try {
        await updateDoc(doc(db, "reportes", id), { estado: "Resuelto" });
        consultarReportes();
      } catch (err) { alert("Error al resolver."); }
    }

    window.eliminarReporte = async function(id) {
      if (!confirm("¿Eliminar definitivamente de Firebase?")) return;
      try {
        await deleteDoc(doc(db, "reportes", id));
        consultarReportes();
      } catch (err) { alert("Error al eliminar."); }
    }

    // Exponer la función de inicio al ámbito del botón HTML
    window.validarAcceso = validarAcceso;

  </script>
</body>
</html>

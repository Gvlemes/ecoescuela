<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Escuela Limpia</title>
    <!-- LIBRERÍAS DE FIREBASE COMPATIBLES -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #F5F5F5; color: #333; }
        header { background-color: #0D47A1; color: white; text-align: center; padding: 15px; }
        .contenedor-principal { padding: 20px; max-width: 600px; margin: 0 auto; }
        .panel-admin { background-color: #FFFFFF; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { margin-bottom: 15px; text-align: center; color: #0D47A1; }
        .item-reporte { border-left: 5px solid #0D47A1; background: #F9F9F9; padding: 15px; margin-top: 15px; border-radius: 0 6px 6px 0; font-size: 14px; }
        .img-admin { max-width: 100%; max-height: 200px; margin-top: 10px; display: block; border-radius: 4px; }
        .btn-status { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 12px; }
        .btn-resolver { background-color: #2E7D32; color: white; margin-right: 5px; }
        .btn-pendiente { background-color: #EF6C00; color: white; }
        .btn-borrar { background-color: #D32F2F; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h2>📋 Panel de Administración</h2>
</header>

<main class="contenedor-principal">
    <div class="panel-admin">
        <h3>Bandeja de Entrada de Incidencias</h3>
        <!-- Los reportes se acomodan automáticamente aquí de forma limpia -->
        <div id="contenedorReportesAdmin"></div>
        <button class="btn-borrar" onclick="borrarHistorialTotal()">Vaciar Base de Datos</button>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>

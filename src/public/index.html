<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escuela Limpia - Alumnos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #F5F5F5; color: #333; }
    header { background-color: #1B5E20; color: white; text-align: center; padding: 15px; }
    .tab-bar { display: flex; background-color: #FFFFFF; border-bottom: 1px solid #E0E0E0; position: sticky; top: 0; z-index: 100; }
    .tab-btn { flex: 1; background: none; border: none; padding: 12px 5px; font-size: 13px; font-weight: bold; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #1B5E20; border-bottom: 3px solid #1B5E20; background-color: #E8F5E9; }
    .contenedor-principal { padding: 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; background-color: #FFFFFF; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .tab-content.active { display: block; }
    h3 { margin-bottom: 15px; text-align: center; color: #1B5E20; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #CCC; border-radius: 6px; font-size: 14px; }
    optgroup { font-weight: bold; color: #1B5E20; background: #f4f4f4; }
    option { font-weight: normal; color: #333; background: #fff; }
    .panel-alerta { padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.5; margin-top: 15px; }
    .panel-alerta.verde { background-color: #E8F5E9; color: #1B5E20; border: 1px solid #C8E6C9; }
    .panel-alerta.naranja { background-color: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }
    .btn-accion { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; background-color: #1B5E20; }
    .btn-accion:hover { background-color: #144317; }
    .preview-img { max-width: 100%; max-height: 150px; display: block; margin: 10px auto; border-radius: 6px; }
    .status-card { background: #f9f9f9; padding: 12px; border-radius: 6px; margin-top: 10px; border-left: 4px solid #666; }
    .status-resuelto { border-left-color: #28a745; background-color: #e8f5e9; }
    .status-pendiente { border-left-color: #ffc107; background-color: #fffde7; }
  </style>

  <!-- CONTROL COMPATIBLE DE FIREBASE CORE -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body>

<header>
  <h2>🌱 Escuela Limpia</h2>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="cambiarPestana('degradacion', this)">Degradación</button>
  <button class="tab-btn" onclick="cambiarPestana('reportar', this)">Reportar</button>
  <button class="tab-btn" onclick="cambiarPestana('calculadora', this)">Calculadora</button>
  <button class="tab-btn" onclick="cambiarPestana('estado', this)">Mi Reporte</button>
</nav>

<main class="contenedor-principal">
  
  <!-- PESTAÑA 1: TIEMPOS DE DEGRADACIÓN -->
  <section id="degradacion" class="tab-content active">
    <h3>⏳ Tiempos de Degradación</h3>
    <label for="comboMateriales">Selecciona un residuo escolar o técnico:</label>
    <select id="comboMateriales" onchange="mostrarDegradacion()">
      <option value="">-- Seleccionar Elemento --</option>
      <optgroup label="📋 Componentes Básicos / Comunes">
        <option value="pet">Botella de Plástico</option>
        <option value="chicle">Chicle de Goma</option>
        <option value="aluminio">Lata de Aluminio</option>
        <option value="vidrio">Botella de Vidrio</option>
        <option value="carton">Cartón o Papel</option>
        <option value="bolsa">Bolsa Plástica</option>
        <option value="unicel">Contenedor de Unicel</option>
        <option value="organico">Desechos Orgánicos</option>
      </optgroup>
      <optgroup label="⚙️ Mecatrónica">
        <option value="pcbs">Tarjeta de Circuito / PCB</option>
        <option value="soldadura">Residuos de Soldadura</option>
        <option value="jumpers">Cables Jumpers de Conexión</option>
        <option value="motores">Motores DC / Servomotores</option>
        <option value="resistencias">Componentes / Resistencias</option>
      </optgroup>
      <optgroup label="🏭 Producción Industrial">
        <option value="virutas">Virutas de Metal con Aceite</option>
        <option value="bandas">Bandas de Transmisión de Goma</option>
        <option value="cascos">Cascos de Seguridad Industrial</option>
      </optgroup>
      <optgroup label="💻 Soporte y Mantenimiento">
        <option value="ethernet">Aislamiento Cable Ethernet (PVC)</option>
        <option value="pilas">Pilas de Reloj / Motherboard</option>
        <option value="carcasas">Carcasas de Plástico Rígido ABS</option>
        <option value="gabinetes">Gabinetes de Computadoras</option>
        <option value="termica">Pasta Térmica Usada</option>
      </optgroup>
      <optgroup label="💾 Programación">
        <option value="discos">Discos Duros Dañados</option>
      </optgroup>
      <optgroup label="💼 Procesos de Gestión Administrativa">
        <option value="toner">Cartuchos de Tóner</option>
        <option value="carpetas">Carpetas Plásticas Archivadoras</option>
        <option value="hojas_calculo">Hojas de Cálculo Impresas</option>
      </optgroup>
    </select>
    <div id="cajaResultadoDegradacion" class="panel-alerta verde" style="margin-top:15px;">Por favor, selecciona una opción del menú para auditar su impacto ambiental.</div>
  </section>

  <!-- PESTAÑA 2: FORMULARIO DE REPORTES -->
  <section id="reportar" class="tab-content">
    <h3>📢 Generar Reporte</h3>
    <form id="formularioReporte" onsubmit="event.preventDefault(); enviarReporte(); return false;">
      <label>Tu Nombre o Grupo:</label>
      <input type="text" id="txtNombreAlumno" placeholder="Ej. Juan - 3º A" required>
      
      <label>¿Cuál es el problema?</label>
      <textarea id="txtDescripcion" placeholder="Ej. Hay residuos tirados en el taller..." rows="3" required></textarea>
      
      <label>Evidencia en Foto (Opcional):</label>
      <input type="file" id="inputFoto" accept="image/*" onchange="previsualizarFoto(event)">
      
      <div id="txtPrevia" style="font-size:12px; color:#666; text-align:center; margin:10px 0;">Ninguna foto seleccionada</div>
      <img id="imgPrevia" class="preview-img" style="display:none;">

      <button type="submit" class="btn-accion">Enviar Reporte a la Escuela</button>
    </form>
  </section>

  <!-- PESTAÑA 3: CALCULADORA -->
  <section id="calculadora" class="tab-content">
    <h3>🧮 Calculadora de Desechos</h3>
    <label>¿Cuántas botellas plásticas usas a la semana?</label>
    <input type="number" id="txtCantidadPet" min="0" value="0">
    <button class="btn-accion" onclick="calcularHuella()">Calcular mi Impacto</button>
    <div id="cajaResultadoCalculadora" style="display:none;"></div>
  </section>

  <!-- PESTAÑA 4: REVISAR ESTADO -->
  <section id="estado" class="tab-content">
    <h3>🔍 Estado de mi Reporte</h3>
    <label>Escribe tu nombre para buscar tu reporte:</label>
    <input type="text" id="busquedaNombre" placeholder="Ej. Juan - 3º A">
    <button class="btn-accion" onclick="buscarMisReportes()">Buscar Historial</button>
    <div id="listaMisReportes" style="margin-top: 15px;"></div>
  </section>

</main>

<!-- INTERCEPTOR TRANSPARENTE DE LLAMADAS DE RED HACIA LA NUBE -->
<script>
  const firebaseConfig = {
    apiKey: "TU_API_KEY_AQUÍ",
    authDomain: "://firebaseapp.com",
    projectId: "tu-proyecto-id",
    storageBucket: "://appspot.com",
    messagingSenderId: "tu-sender-id",
    appId: "tu-app-id"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const originalFetch = window.fetch;
  window.fetch = async function (url, options) {
    if (url === "/api/guardar" && options && options.method === "POST") {
      try {
        const datosReporte = JSON.parse(options.body);
        datosReporte.timestamp = Date.now();
        
        await db.collection("reportesEscuela").add(datosReporte);
        return new Response(JSON.stringify({ ok: true }), { status: 200 });
      } catch (error) {
        console.error(error);
        return new Response(JSON.stringify({ ok: false }), { status: 500 });
      }
    }

    if (url === "/api/datos") {
      try {
        const querySnapshot = await db.collection("reportesEscuela").orderBy("timestamp", "desc").get();
        const listaNube = [];
        querySnapshot.forEach((doc) => {
          const item = doc.data();
          item.id = doc.id;
          listaNube.push(item);
        });
        return new Response(JSON.stringify(listaNube), { status: 200 });
      } catch (error) {
        return new Response(JSON.stringify([]), { status: 500 });
      }
    }
    return originalFetch(url, options);
  };
</script>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Limpia - Alumnos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #F5F5F5; color: #333; }
        header { background-color: #1B5E20; color: white; text-align: center; padding: 15px; }
        .tab-bar { display: flex; background-color: #FFFFFF; border-bottom: 1px solid #E0E0E0; position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; background: none; border: none; padding: 12px 5px; font-size: 13px; font-weight: bold; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #1B5E20; border-bottom: 3px solid #1B5E20; background-color: #E8F5E9; }
        .contenedor-principal { padding: 20px; max-width: 500px; margin: 0 auto; }
        .tab-content { display: none; background-color: #FFFFFF; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }
        h3 { margin-bottom: 15px; text-align: center; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        select, input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #CCC; border-radius: 6px; font-size: 14px; }
        textarea { resize: vertical; min-height: 80px; }
        .panel-alerta { padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.5; margin-top: 15px; }
        .panel-alerta.verde { background-color: #E8F5E9; color: #1B5E20; border: 1px solid #C8E6C9; }
        .panel-alerta.naranja { background-color: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }
        .btn-accion { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-accion.verde-oscuro { background-color: #1B5E20; }
    </style>
</head>
<body>

<header>
    <h2>🌱 Escuela Limpia</h2>
</header>

<nav class="tab-bar">
    <button class="tab-btn active" onclick="cambiarPestana('degradacion', this)">Degradación</button>
    <button class="tab-btn" onclick="cambiarPestana('reportar', this)">Reportar</button>
    <button class="tab-btn" onclick="cambiarPestana('calculadora', this)">Calculadora</button>
</nav>

<main class="contenedor-principal">
    <!-- PESTAÑA DEGRADACIÓN -->
    <section id="degradacion" class="tab-content active">
        <h3>⏳ ¿Cuánto tardan en degradarse?</h3>
        <label for="comboMateriales">Selecciona un material:</label>
        <select id="comboMateriales" onchange="mostrarDegradacion()">
            <option value="">-- Seleccionar --</option>
            <option value="450 años">Botella de Plástico</option>
            <option value="5 años">Chicle</option>
            <option value="10 años">Lata de Aluminio</option>
            <option value="1 año">Papel o Cartón</option>
            <option value="4000 años">Botella de Vidrio</option>
        </select>
        <div id="resultadoDegradacion"></div>
    </section>

    <!-- PESTAÑA REPORTAR -->
    <section id="reportar" class="tab-content">
        <h3>📢 Generar Reporte</h3>
        <!-- El id="formReporte" conecta directamente con app.js -->
        <form id="formReporte">
            <label for="nombreGrupo">Tu Nombre o Grupo:</label>
            <input type="text" id="nombreGrupo" placeholder="Ej. Juan Pérez / 3º B" required>
            
            <label for="problema">¿Cuál es el problema?</label>
            <textarea id="problema" placeholder="Describe la situación de limpieza..." required></textarea>
            
            <button type="submit" class="btn-accion verde-oscuro">Enviar Reporte</button>
        </form>
        <div id="mensajeEnvio"></div>
    </section>

    <!-- PESTAÑA CALCULADORA -->
    <section id="calculadora" class="tab-content">
        <h3>🧮 Calculadora de Desechos</h3>
        <label for="cantBotellas">¿Cuántas botellas plásticas usas a la semana?</label>
        <input type="number" id="cantBotellas" min="0" value="0">
        <button class="btn-accion verde-oscuro" onclick="calcularImpacto()">Calcular Impacto</button>
        <div id="resultadoCalculo"></div>
    </section>
</main>

<!-- IMPORTANTE: Conexión con tu archivo app.js -->
<script src="app.js"></script>
</body>
</html>

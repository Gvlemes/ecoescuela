<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escuela Limpia - Alumnos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #F5F5F5; color: #333; }
    header { background-color: #1B5E20; color: white; text-align: center; padding: 15px; }
    .tab-bar { display: flex; background-color: #FFFFFF; border-bottom: 1px solid #E0E0E0; position: sticky; top: 0; z-index: 100; }
    .tab-btn { flex: 1; background: none; border: none; padding: 12px 5px; font-size: 13px; font-weight: bold; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #1B5E20; border-bottom: 3px solid #1B5E20; background-color: #E8F5E9; }
    .contenedor-principal { padding: 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; background-color: #FFFFFF; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .tab-content.active { display: block; }
    h3 { margin-bottom: 15px; text-align: center; color: #1B5E20; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #CCC; border-radius: 6px; font-size: 14px; }
    optgroup { font-weight: bold; color: #1B5E20; background: #f4f4f4; }
    option { font-weight: normal; color: #333; background: #fff; }
    .panel-alerta { padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.5; margin-top: 15px; }
    .panel-alerta.verde { background-color: #E8F5E9; color: #1B5E20; border: 1px solid #C8E6C9; }
    .panel-alerta.naranja { background-color: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }
    .btn-accion { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; background-color: #1B5E20; }
    .btn-accion:hover { background-color: #144317; }
    .preview-img { max-width: 100%; max-height: 150px; display: block; margin: 10px auto; border-radius: 6px; }
    .status-card { background: #f9f9f9; padding: 12px; border-radius: 6px; margin-top: 10px; border-left: 4px solid #666; }
    .status-resuelto { border-left-color: #28a745; background-color: #e8f5e9; }
    .status-pendiente { border-left-color: #ffc107; background-color: #fffde7; }
  </style>

  <!-- LIBRERÍAS DE FIREBASE CORREGIDAS -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
</head>
<body>

<header>
  <h2>🌱 Escuela Limpia</h2>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="cambiarPestana('degradacion', this)">Degradación</button>
  <button class="tab-btn" onclick="cambiarPestana('reportar', this)">Reportar</button>
  <button class="tab-btn" onclick="cambiarPestana('calculadora', this)">Calculadora</button>
  <button class="tab-btn" onclick="cambiarPestana('estado', this)">Mi Reporte</button>
</nav>

<main class="contenedor-principal">
  
  <!-- PESTAÑA 1: TIEMPOS DE DEGRADACIÓN -->
  <section id="degradacion" class="tab-content active">
    <h3>⏳ Tiempos de Degradación</h3>
    <label for="comboMateriales">Selecciona un residuo escolar o técnico:</label>
    <select id="comboMateriales" onchange="mostrarDegradacion()">
      <option value="">-- Seleccionar Elemento --</option>
      <optgroup label="📋 Componentes Básicos / Comunes">
        <option value="pet">Botella de Plástico</option>
        <option value="chicle">Chicle de Goma</option>
        <option value="aluminio">Lata de Aluminio</option>
        <option value="vidrio">Botella de Vidrio</option>
        <option value="carton">Cartón o Papel</option>
        <option value="bolsa">Bolsa Plástica</option>
        <option value="unicel">Contenedor de Unicel</option>
        <option value="organico">Desechos Orgánicos</option>
      </optgroup>
      <optgroup label="⚙️ Mecatrónica">
        <option value="pcbs">Tarjeta de Circuito / PCB</option>
        <option value="soldadura">Residuos de Soldadura</option>
        <option value="jumpers">Cables Jumpers de Conexión</option>
        <option value="motores">Motores DC / Servomotores</option>
        <option value="resistencias">Componentes / Resistencias</option>
      </optgroup>
      <optgroup label="🏭 Producción Industrial">
        <option value="virutas">Virutas de Metal con Aceite</option>
        <option value="bandas">Bandas de Transmisión de Goma</option>
        <option value="cascos">Cascos de Seguridad Industrial</option>
      </optgroup>
      <optgroup label="💻 Soporte y Mantenimiento">
        <option value="ethernet">Aislamiento Cable Ethernet (PVC)</option>
        <option value="pilas">Pilas de Reloj / Motherboard</option>
        <option value="carcasas">Carcasas de Plástico Rígido ABS</option>
        <option value="gabinetes">Gabinetes de Computadoras</option>
        <option value="termica">Pasta Térmica Usada</option>
      </optgroup>
      <optgroup label="💾 Programación">
        <option value="discos">Discos Duros Dañados</option>
      </optgroup>
      <optgroup label="💼 Procesos de Gestión Administrativa">
        <option value="toner">Cartuchos de Tóner</option>
        <option value="carpetas">Carpetas Plásticas Archivadoras</option>
        <option value="hojas_calculo">Hojas de Cálculo Impresas</option>
      </optgroup>
    </select>
    <div id="cajaResultadoDegradacion" class="panel-alerta verde" style="margin-top:15px;">Por favor, selecciona una opción del menú para auditar su impacto ambiental.</div>
  </section>

  <!-- PESTAÑA 2: FORMULARIO DE REPORTES -->
  <section id="reportar" class="tab-content">
    <h3>📢 Generar Reporte</h3>
    <form id="formularioReporte" onsubmit="event.preventDefault(); enviarReporte(); return false;">
      <label>Tu Nombre o Grupo:</label>
      <input type="text" id="txtNombreAlumno" placeholder="Ej. Juan - 3º A" required>
      
      <label>¿Cuál es el problema?</label>
      <textarea id="txtDescripcion" placeholder="Ej. Hay residuos tirados en el taller..." rows="3" required></textarea>
      
      <label>Evidencia en Foto (Opcional):</label>
      <input type="file" id="inputFoto" accept="image/*" onchange="previsualizarFoto(event)">
      
      <div id="txtPrevia" style="font-size:12px; color:#666; text-align:center; margin:10px 0;">Ninguna foto seleccionada</div>
      <img id="imgPrevia" class="preview-img" style="display:none;">

      <button type="submit" class="btn-accion">Enviar Reporte a la Escuela</button>
    </form>
  </section>

  <!-- PESTAÑA 3: CALCULADORA -->
  <section id="calculadora" class="tab-content">
    <h3>🧮 Calculadora de Desechos</h3>
    <label>¿Cuántas botellas plásticas usas a la semana?</label>
    <input type="number" id="txtCantidadPet" min="0" value="0">
    <button class="btn-accion" onclick="calcularHuella()">Calcular mi Impacto</button>
    <div id="cajaResultadoCalculadora" style="display:none;"></div>
  </section>

  <!-- PESTAÑA 4: REVISAR ESTADO -->
  <section id="estado" class="tab-content">
    <h3>🔍 Estado de mi Reporte</h3>
    <label>Escribe tu nombre para buscar tu reporte:</label>
    <input type="text" id="busquedaNombre" placeholder="Ej. Juan - 3º A">
    <button class="btn-accion" onclick="buscarMisReportes()">Buscar Historial</button>
    <div id="listaMisReportes" style="margin-top: 15px;"></div>
  </section>

</main>
<script>
  // Configuración de las llaves del proyecto Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCCVjAAdkiNMIB3odwWXDUBbGurE9bgZYM",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "escuelalimpia",
    storageBucket: "escuelalimpia.firebasestorage.app",
    messagingSenderId: "13533291736",
    appId: "1:13533291736:web:e3e8d514addb119fc4a3ad",
    measurementId: "G-KV3Y0V117P"
  };

  // Inicialización de la base de datos
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();
  let base64Foto = ""; // Variable para almacenar la imagen temporalmente
  // ==========================================
  // 1. NAVEGACIÓN ENTRE PESTAÑAS
  // ==========================================
  function cambiarPestana(idPestana, boton) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(idPestana).classList.add('active');
    boton.classList.add('active');
  }

  // ==========================================
  // 2. CONCIENTIZACIÓN DE DEGRADACIÓN
  // ==========================================
  function mostrarDegradacion() {
    const material = document.getElementById("comboMateriales").value;
    const res = document.getElementById("cajaResultadoDegradacion");
    
    const datos = {
      pet: { tiempo: "450 años", info: "Las botellas se fragmentan en microplásticos dañinos para el suelo.", tipo: "naranja" },
      chicle: { tiempo: "5 años", info: "Contiene resinas sintéticas que los pájaros confunden con comida.", tipo: "naranja" },
      aluminio: { tiempo: "10 años", info: "El aluminio se oxida lentamente, requiere mucha energía reciclarlo.", tipo: "naranja" },
      vidrio: { tiempo: "4,000 años", info: "Es 100% reciclable de forma infinita, pero tarda milenios en la naturaleza.", tipo: "naranja" },
      carton: { tiempo: "1 año", info: "Se degrada rápido si hay humedad, pero evitemos desperdiciarlo.", tipo: "verde" },
      bolsa: { tiempo: "150 a 500 años", info: "Se fragmentan obstruyendo alcantarillas y dañando fauna.", tipo: "naranja" },
      unicel: { tiempo: "500 años o más", info: "El unicel no se biodegrada y divide su tamaño eternamente.", tipo: "naranja" },
      organico: { tiempo: "4 semanas", info: "Se descompone velozmente. ¡Ideal para la composta de la escuela!", tipo: "verde" },
      pcbs: { tiempo: "Más de 1,000 años", info: "Las PCBs contienen fibra de vidrio y resinas epóxicas. Requieren reciclaje electrónico.", tipo: "naranja" },
      soldadura: { tiempo: "Indefinido", info: "Contiene metales pesados que pueden contaminar mantos acuíferos si se tiran al suelo.", tipo: "naranja" },
      jumpers: { tiempo: "100 a 400 años", info: "Su aislamiento exterior es plástico duradero. El cobre interno es reciclable.", tipo: "naranja" },
      motores: { tiempo: "Siglos", info: "Contienen imanes, cobre y acero. Deben desarmarse de forma segura.", tipo: "naranja" },
      resistencias: { tiempo: "Indefinido", info: "Los recubrimientos cerámicos y de carbón resisten mucho tiempo a la intemperie.", tipo: "naranja" },
      virutas: { tiempo: "50 a 100 años", info: "Las virutas metálicas se oxidan lentamente. Se pueden reutilizar en fundición.", tipo: "naranja" },
      bandas: { tiempo: "50 años", info: "El caucho sintético vulcanizado tarda décadas en perder elasticidad.", tipo: "naranja" },
      cascos: { tiempo: "Varios siglos", info: "El polietileno de alta densidad resiste impactos directos y climas extremos.", tipo: "naranja" },
      ethernet: { tiempo: "100 a 400 años", info: "El aislamiento de PVC libera toxinas si se quema. Separa el cobre de forma segura.", tipo: "naranja" },
      pilas: { tiempo: "500 a 1,000 años", info: "Las pilas de botón contienen mercurio o litio altamente tóxicos.", tipo: "naranja" },
      carcasas: { tiempo: "Varios siglos", info: "El plástico ABS tarda muchísimo en degradarse y acumula toxinas.", tipo: "naranja" },
      gabinetes: { tiempo: "50 a 100 años", info: "Son láminas de acero o aluminio que se oxidan, pero son reciclables.", tipo: "naranja" },
      termica: { tiempo: "Altamente persistente", info: "Contiene siliconas y óxidos metálicos que no se disuelven en agua.", tipo: "naranja" },
      discos: { tiempo: "Varios siglos", info: "Los platos magnéticos y carcasas de aluminio pueden ser procesados por separado.", tipo: "naranja" },
      toner: { tiempo: "450 años", info: "El polvo de tóner es un peligro respiratorio y su carcasa plástica dura siglos.", tipo: "naranja" },
      carpetas: { tiempo: "Varios siglos", info: "El plástico de PVC rígido o polipropileno tarda generaciones en desaparecer.", tipo: "naranja" },
      hojas_calculo: { tiempo: "1 año", info: "Papel común. Se degrada rápido pero representa desperdicio de celulosa.", tipo: "verde" }
    };

    if(!material) { 
      res.className = "panel-alerta verde";
      res.innerHTML = "Por favor, selecciona una opción del menú para auditar su impacto ambiental."; 
      return; 
    }
    
    const data = datos[material];
    res.className = `panel-alerta ${data.tipo}`;
    res.innerHTML = `<strong>Tiempo de degradación:</strong> ${data.tiempo}<br><small>${data.info}</small>`;
  }

  // ==========================================
  // 3. REPORTAR CON IMAGEN (BASE64 OPTIMIZADA)
  // ==========================================
  function previsualizarFoto(event) {
    const input = event.target;
    const preview = document.getElementById("imgPrevia");
    const txtPrevia = document.getElementById("txtPrevia");
    
    if (!input.files || input.files.length === 0) {
      preview.style.display = "none";
      txtPrevia.innerText = "Ninguna foto seleccionada";
      base64Foto = "";
      return;
    }

    const archivo = input.files[0];
    txtPrevia.innerText = archivo.name;
    const reader = new FileReader();

    reader.onload = function (e) {
      const img = new Image();
      img.src = e.target.result;

      img.onload = function () {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 500; 
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        base64Foto = canvas.toDataURL("image/jpeg", 0.6);
        preview.src = base64Foto;
        preview.style.display = "block";
      };
    };

    reader.readAsDataURL(archivo);
  }

  async function enviarReporte() {
    const nombre = document.getElementById("txtNombreAlumno").value.trim();
    const mensaje = document.getElementById("txtDescripcion").value.trim();
    const fotoAEnviar = base64Foto || "";

    if (!nombre || !mensaje) {
      alert("Por favor llena los campos requeridos.");
      return;
    }

    try {
      // Envío directo a Cloud Firestore
      await db.collection("reportes").add({
        nombre: nombre,
        mensaje: mensaje,
        foto: fotoAEnviar,
        estado: "Pendiente",
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("¡Reporte enviado con éxito! Puedes consultar su estado en la sección 'Mi Reporte' usando tu nombre.");
      
      // Limpieza del formulario
      document.getElementById("formularioReporte").reset();
      document.getElementById("imgPrevia").style.display = "none";
      document.getElementById("txtPrevia").innerText = "Ninguna foto seleccionada";
      base64Foto = "";

    } catch (error) {
      console.error("Error al guardar en Firestore:", error);
      alert("Hubo un problema de conexión para guardar el reporte.");
    }
  }

  // ==========================================
  // 4. CALCULADORA ECOLÓGICA
  // ==========================================
  function calcularHuella() {
    const botellas = parseInt(document.getElementById("txtCantidadPet").value) || 0;
    const totalAnual = botellas * 52;
    const tiempoDegradacion = totalAnual > 0 ? "450 años" : "0 años";
    const contenedor = document.getElementById("cajaResultadoCalculadora");
    
    let recomendacion = "";
    let claseAlerta = "";

    if (botellas === 0) {
      claseAlerta = "verde";
      recomendacion = "🌟 <strong>¡Increíble, nivel Héroe Ecológico!</strong> Sigue así, estás cuidando al planeta al máximo al no generar estos residuos.";
    } else if (botellas >= 1 && botellas <= 3) {
      claseAlerta = "verde";
      recomendacion = "👍 <strong>¡Buen trabajo!</strong> Tu consumo es bajo. Intenta sustituirlas por completo usando un termo reutilizable en la escuela.";
    } else if (botellas >= 4 && botellas <= 7) {
      claseAlerta = "naranja";
      recomendacion = "⚠️ <strong>¡Atención!</strong> Estás usando casi una botella diaria. Te sugerimos organizar con tu grupo un reto para usar cantimploras de agua.";
    } else {
      claseAlerta = "naranja";
      recomendacion = "🚨 <strong>¡Alerta Ecológica!</strong> Tu consumo es muy alto. Recuerda que cada botella tarda siglos en degradarse. ¡Es momento de cambiar a un termo hoy mismo!";
    }
    
    contenedor.style.display = "block";
    contenedor.innerHTML = `
      <div class="panel-alerta ${claseAlerta}">
        📊 <strong>Tu impacto estimado:</strong><br>
        Desechas unas <strong>${totalAnual} botellas</strong> de plástico al año.<br>
        Esa basura acumulada tardará más de <strong>${tiempoDegradacion}</strong> en desaparecer de la Tierra si no se recicla.<br><br>
        🌱 <strong>Recomendación para ti:</strong><br>
        ${recomendacion}
      </div>`;
  }

  // ==========================================
  // 5. CONSULTAR ESTADO DE MIS REPORTES
  // ==========================================
  async function buscarMisReportes() {
    const nombreBuscar = document.getElementById("busquedaNombre").value.trim().toLowerCase();
    const contenedor = document.getElementById("listaMisReportes");
    if (!nombreBuscar) { alert("Escribe un nombre para buscar."); return; }

    contenedor.innerHTML = "<p>Buscando en la base de datos...</p>";
    
    try {
      const snapshot = await db.collection("reportes").get();
      contenedor.innerHTML = "";
      
      let encontrados = 0;

      snapshot.forEach(doc => {
        const item = doc.data();
        if (item.nombre && item.nombre.toLowerCase().includes(nombreBuscar)) {
          encontrados++;
const div = document.createElement("div");
          
          let claseEstado = "status-pendiente";
          if (item.estado && item.estado.toLowerCase() === "resuelto") {
            claseEstado = "status-resuelto";
          }

          const htmlFoto = item.foto 
            ? `<img src="${item.foto}" alt="Evidencia" class="preview-img" style="margin: 10px 0 0 0; max-height: 100px;">` 
            : '';

          div.className = `status-card ${claseEstado}`;
          div.innerHTML = `
            <h4>👤 Alumno: ${item.nombre}</h4>
            <p style="margin-top:5px;"><strong>Problema:</strong> ${item.mensaje}</p>
            <p style="margin-top:5px;"><strong>Estado:</strong> <span>${item.estado || 'Pendiente'}</span></p>
            ${htmlFoto}
          `;
          contenedor.appendChild(div);
        }
      });

      if (encontrados === 0) {
        contenedor.innerHTML = "<p>No se encontraron reportes registrados para este nombre.</p>";
      }

    } catch (error) {
      console.error("Error al obtener los reportes:", error);
      contenedor.innerHTML = "<p>Hubo un problema al conectar con la base de datos.</p>";
    }

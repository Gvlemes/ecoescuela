<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Escuela Limpia</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #F4F6F9; color: #333; padding: 20px; }
        header { background-color: #1B5E20; color: white; text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .seccion { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        #login { max-width: 400px; margin: 100px auto; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #CCC; border-radius: 6px; font-size: 15px; }
        button { background-color: #1B5E20; color: white; border: none; font-weight: bold; cursor: pointer; }
        .grid-analitica { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 768px) { .grid-analitica { grid-template-columns: 1fr; } }
        .canvas-contenedor { position: relative; height: 220px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #EEE; font-size: 14px; }
        th { background-color: #1B5E20; color: white; }
        .img-miniatura { width: 100px; height: auto; border-radius: 4px; background-color: #EEE; min-height: 50px; display: block; }
        .indicador-carga { text-align: center; padding: 20px; font-weight: bold; color: #1B5E20; }
    </style>
</head>
<body>

            <div class="seccion">
            <h3>📋 Tabla de Evidencias (Memoria Interna del Dispositivo)</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nº Reporte ID</th>
                            <th>📅 Fecha de Registro</th>
                            <th>📝 Descripción del Desperdicio</th>
                            <th>📸 Evidencia Visual</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
            <button onclick="location.reload()" style="background-color:#757575; max-width: 150px; margin-top: 20px;">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        let chartInstancia = null;

        function entrarPanel() {
            const clave = document.getElementById('passAdmin').value;
            if (clave === "mecatronica") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                cargarDatosYEstadisticasLocales(); // Llama al motor de memoria interna nativa
            } else {
                alert("Clave incorrecta.");
                document.getElementById('passAdmin').value = "";
            }
        }

        // 💾 MOTOR 100% OFFLINE: Lee el almacenamiento seguro del navegador
        function cargarDatosYEstadisticasLocales() {
            const cuerpo = document.getElementById('cuerpoTabla');
            const contador = document.getElementById('totalContador');
            
            cuerpo.innerHTML = "";

            // Jalamos el archivo JSON guardado por index.html en el LocalStorage del teléfono
            const historialLocal = JSON.parse(localStorage.getItem('bd_escuela_limpia')) || [];
            
            contador.innerText = historialLocal.length;

            if (historialLocal.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999; padding:20px;">No hay misiones registradas de forma local en este dispositivo todavía.</td></tr>`;
                return;
            }

            let mapaFechasLocal = {};

            // 📋 LLENAMOS LA TABLA CON LOS DATOS LOCALES REALES
            historialLocal.forEach(r => {
                // Filtramos la fecha para agrupar los reportes por día en el gráfico
                let soloFecha = r.fecha.split(" ")[0] || r.fecha;
                mapaFechasLocal[soloFecha] = (mapaFechasLocal[soloFecha] || 0) + 1;

                const fila = document.createElement('tr');
                const fotoTag = r.foto ? `<img src="${r.foto}" class="img-miniatura" onclick="window.open(this.src)">` : `<div class='img-miniatura' style='text-align:center;line-height:50px;font-size:11px;color:#999;'>Sin Imagen</div>`;
                
                fila.innerHTML = `<td><strong>#${r.id}</strong></td>` +
                                 `<td>${r.fecha}</td>` +
                                 `<td>${r.descripcion}</td>` +
                                 `<td>${fotoTag}</td>`;
                cuerpo.appendChild(fila);
            });

            // Mandamos los picos de días calculados al motor gráfico de Chart.js
            dibujarGrafica(mapaFechasLocal);
        }

        function dibujarGrafica(mapaFechas) {
            const ctx = document.getElementById('graficaReportes').getContext('2d');
            if (chartInstancia) chartInstancia.destroy();

            chartInstancia = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(mapaFechas),
                    datasets: [{
                        label: 'Cantidad de Reportes Diarios',
                        data: Object.values(mapaFechas),
                        backgroundColor: 'rgba(27, 94, 32, 0.3)',
                        borderColor: 'rgba(27, 94, 32, 1)',
                        borderWidth: 2,
                        borderRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Limpia - Inicio de Sesión</title>
    <!-- Bootstrap 5 para el diseño responsivo -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        :root {
            --institucional-guinda: #6A1B29;
            --institucional-dorado: #BC955C;
        }
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border-top: 5px solid var(--institucional-guinda);
            max-width: 420px;
            width: 100%;
        }
        .btn-guinda {
            background-color: var(--institucional-guinda);
            color: white;
            border: 1px solid var(--institucional-guinda);
        }
        .btn-guinda:hover {
            background-color: #4A121C;
            color: #BC955C;
        }
        .text-dorado {
            color: var(--institucional-dorado) !important;
        }
        .logo-institucional {
            max-height: 65px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center px-3">
        <div class="card card-login shadow border-0 rounded-3 p-4">
            
            <!-- Encabezado con Logotipo Oficial -->
            <div class="text-center mb-4">
                <img src="https://cecyteh.edu.mx" class="logo-institucional mb-3" alt="Logo CECYTEH">
                <h5 class="fw-bold text-secondary text-uppercase tracking-wide mb-1">Escuela Limpia</h5>
                <p class="text-muted small">Sistema de Control e Impacto Ambiental</p>
            </div>

            <!-- Formulario de Entrada -->
            <form id="formLogin">
                <!-- Selector de Rol (Tipo de Usuario) -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Tipo de Usuario</label>
                    <select id="tipoUsuario" class="form-select" onchange="cambiarPlaceholders()" required>
                        <option value="alumno">Alumno (Estudiante)</option>
                        <option value="encargado">Encargado (Administrador/Docente)</option>
                    </select>
                </div>

                <!-- Campo de Usuario Dinámico -->
                <div class="mb-3">
                    <label id="labelUsuario" class="form-label text-muted small fw-bold">Matrícula</label>
                    <input type="text" id="inputUsuario" class="form-control" placeholder="Ej. 233H01928" required>
                </div>

                <!-- Campo de Contraseña -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Contraseña</label>
                    <input type="password" id="inputPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <!-- Botón de Ingreso Estilo SIGA -->
                <div class="d-grid mb-2">
                    <button type="submit" class="btn btn-guinda fw-bold py-2">Ingresar al Sistema</button>
                </div>
            </form>
            
            <!-- Pie de la tarjeta -->
            <div class="text-center mt-3 border-top pt-2">
                <span class="text-muted text-uppercase fw-bold text-dorado" style="font-size: 0.75rem;">CECYTEH Hidalgo</span>
            </div>

        </div>
    </div>
    <!-- Lógica de Navegación entre Módulos -->
    <script>
        // Cambia los textos informativos en pantalla dependiendo del rol seleccionado
        function cambiarPlaceholders() {
            const tipo = document.getElementById("tipoUsuario").value;
            const label = document.getElementById("labelUsuario");
            const input = document.getElementById("inputUsuario");

            if (tipo === "encargado") {
                label.innerText = "Usuario / RFC";
                input.placeholder = "Ej. ARCH680512";
            } else {
                label.innerText = "Matrícula";
                input.placeholder = "Ej. 233H01928";
            }
        }

        // Procesa el formulario y simula el inicio de sesión hacia el archivo correspondiente
        document.getElementById("formLogin").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita que la página se recargue sola
            
            const tipo = document.getElementById("tipoUsuario").value;
            const usuario = document.getElementById("inputUsuario").value;

            alert(`Iniciando sesión como ${tipo}: ${usuario}`);

            // Redirección directa según el rol del usuario
            if (tipo === "encargado") {
                window.location.href = "encargado.html";
            } else {
                window.location.href = "alumno.html";
            }
        });
    </script>
</body>
</html>
